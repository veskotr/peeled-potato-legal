<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peeled Potato</title>
  <style>
:root {
  color-scheme: light dark;
  --bg: #fbfaf7;
  --card: #ffffff;
  --text: #2d2a26;
  --muted: #6f675f;
  --accent: #8a5a35;
  --border: #ded8d1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171512;
    --card: #211e1a;
    --text: #f3eee8;
    --muted: #b9aea3;
    --accent: #d7a174;
    --border: #3b352f;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
}
main {
  max-width: 820px;
  margin: 0 auto;
  padding: 48px 20px 72px;
}
article {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 32px;
}
h1 { margin-top: 0; line-height: 1.2; }
h2 { margin-top: 2rem; line-height: 1.3; }
p, li { max-width: 72ch; }
.muted { color: var(--muted); }
a { color: var(--accent); }
nav { margin-bottom: 20px; }
nav a { margin-right: 16px; }
footer {
  margin-top: 28px;
  color: var(--muted);
  font-size: 0.95rem;
}
</style>
</head>
<body>
<main>
  <article>
    <h1>Peeled Potato</h1>
    <p>Legal information for the Peeled Potato app.</p>
    <p><a href="privacy.html">Privacy Policy</a></p>
    <p><a href="terms.html">Terms and Conditions</a></p>
  </article>
</main>
</body>
</html>
